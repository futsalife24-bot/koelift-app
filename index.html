<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1022" />
    <meta http-equiv="refresh" content="1; url=https://koelift.pages.dev/" />
    <title>コエリフト（移転しました）</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070c1c; color: #e9efff; font-family: system-ui, sans-serif; text-align: center; padding: 16px; }
      a { color: #6fe3ff; font-weight: 700; font-size: 1.1rem; }
    </style>
  </head>
  <body>
    <div>
      <p>コエリフトは新しいアドレスに移りました。</p>
      <p><a href="https://koelift.pages.dev/">https://koelift.pages.dev/</a></p>
      <p style="color:#8e9cc4;font-size:.85rem">ホーム画面に追加する場合は、新しいアドレスから追加してください。</p>
    </div>
    <script>
      // 旧アドレスに残っている Service Worker とキャッシュを片付けてから移動
      (async () => {
        try {
          const regs = (await navigator.serviceWorker?.getRegistrations?.()) ?? [];
          for (const r of regs) if (r.scope.startsWith(location.origin + location.pathname)) await r.unregister();
          for (const k of (await caches?.keys?.()) ?? []) if (k.includes(location.origin + location.pathname)) await caches.delete(k);
        } catch (e) {}
        location.replace('https://koelift.pages.dev/');
      })();
    </script>
  </body>
</html>
